# 開發環境:docker compose up -d 後
#   前端  http://localhost:${WEB_PORT}
#   API   http://localhost:${API_PORT}/api/v1/health
#   DB    127.0.0.1:${POSTGRES_PORT}

x-database-url: &database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 一次性:套用 migrations 後結束,api 等它成功才啟動
  # 其他子指令:docker compose run --rm migrate down 1
  migrate:
    image: migrate/migrate:v4.19.0
    environment:
      DATABASE_URL: *database-url
    volumes:
      - ./backend/migrations:/migrations
    entrypoint: ["sh", "-c", 'migrate -path=/migrations -database "$$DATABASE_URL" "$$@"', "--"]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: dev
    environment:
      APP_ENV: ${APP_ENV}
      HTTP_ADDR: ":8080"
      DATABASE_URL: *database-url
      # 可信任的反向代理(IP/CIDR,逗號分隔);空白表示不採用 X-Forwarded-For
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      JWT_SECRET: ${JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-60}
      REFRESH_RATE_LIMIT_PER_MINUTE: ${REFRESH_RATE_LIMIT_PER_MINUTE:-300}
    ports:
      - "127.0.0.1:${API_PORT}:8080"
    volumes:
      - ./backend:/app
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      target: dev
    environment:
      API_PROXY_TARGET: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # 使用容器內安裝的 linux 版依賴,不吃本機的 node_modules
    depends_on:
      - api
    restart: unless-stopped

  # 工具:由 SQL 產生型別安全的 Go 程式碼(make sqlc),不隨 up 啟動
  sqlc:
    image: sqlc/sqlc:1.30.0
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - ./backend:/src
    command: ["generate"]

  golangci-lint:
    image: golangci/golangci-lint:v2.14.0
    profiles: ["tools"]
    working_dir: /app
    environment:
      # Docker 記憶體小(例如 Docker Desktop 預設 2GB)時,平行編譯會被 OOM 終止;
      # 降低平行度以時間換記憶體
      GOFLAGS: -p=1
      GOMAXPROCS: "2"
    volumes:
      - ./backend:/app
      - gomod:/go/pkg/mod
      - golangci-cache:/root/.cache
    command: ["golangci-lint", "run", "--concurrency=1", "./..."]

volumes:
  pgdata:
  gocache:
  gomod:
  golangci-cache:
