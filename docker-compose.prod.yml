# 正式環境:docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# 與開發用的 docker-compose.yml 完全分開(不熱重載、不開資料庫埠、容器唯讀、限縮權限)。
# 操作流程見 doc/deploy.md。
name: erp-prod

x-database-url: &database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    # 不對外開埠;維運用 docker compose exec 進去,備份用 scripts/backup.sh
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

  # 一次性:套用 migrations 後結束,api 等它成功才啟動。migration 由程式碼庫提供(git checkout 的 backend/migrations)
  migrate:
    image: migrate/migrate:v4.19.0
    environment:
      DATABASE_URL: *database-url
    volumes:
      - ./backend/migrations:/migrations:ro
    entrypoint: ["sh", "-c", 'migrate -path=/migrations -database "$$DATABASE_URL" "$$@"', "--"]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  api:
    build:
      context: ./backend
      target: prod
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: *database-url
      # nginx(web)與你前面的 TLS 代理的網段;沒填的話限流會把全公司當成同一個 IP
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      JWT_SECRET: ${JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-60}
      REFRESH_RATE_LIMIT_PER_MINUTE: ${REFRESH_RATE_LIMIT_PER_MINUTE:-300}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: ./frontend
      target: prod
    ports:
      # 預設只聽本機,由前面的 TLS 代理轉進來;要直接對外請改 WEB_BIND=0.0.0.0(僅限內網 / 測試,因為沒有 HTTPS 登入會失敗)
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # 維運指令:docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm cli create-admin -username admin
  cli:
    build:
      context: ./backend
      target: prod
    profiles: ["tools"]
    entrypoint: ["cli"]
    environment:
      DATABASE_URL: *database-url
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  # 固定網段,TRUSTED_PROXIES 預設值才有依據
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
